# Render Blueprint for the Express backend.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-productivity-assistant-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
